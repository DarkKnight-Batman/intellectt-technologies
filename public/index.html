function sizeCanvas(cv, maxDpr) {
  const dpr = Math.min(devicePixelRatio || 1, maxDpr || 1.5);
  const w = cv.clientWidth || cv.parentElement.clientWidth, h = cv.clientHeight || cv.parentElement.clientHeight;
  cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
  return { w, h, dpr };
}

/* particle network: drifting nodes that link up and lean toward the cursor */
function netFX(cv) {
  const ctx = cv.getContext('2d'); let S = { w: 1, h: 1, dpr: 1 }, P = [];
  const resize = () => {
    S = sizeCanvas(cv);
    const n = Math.max(20, Math.min(60, Math.round(S.w * S.h / 26000)));
    P = Array.from({ length: n }, () => ({ x: Math.random() * S.w, y: Math.random() * S.h, vx: (Math.random() - .5) * .16, vy: (Math.random() - .5) * .16, r: Math.random() * 1.2 + .7, red: Math.random() < .05 }));
  };
  const draw = () => {
    const { w, h, dpr } = S; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const rc = cv.getBoundingClientRect(); const mx = MOUSE.x - rc.left, my = MOUSE.y - rc.top;
    for (const p of P) {
      const dx = mx - p.x, dy = my - p.y, d = Math.hypot(dx, dy);
      if (d < 160 && d > 1) { p.x -= dx / d * .15; p.y -= dy / d * .15; }
      p.x += p.vx; p.y += p.vy;
      if (p.x < -20) p.x = w + 20; if (p.x > w + 20) p.x = -20; if (p.y < -20) p.y = h + 20; if (p.y > h + 20) p.y = -20;
    }
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const a = P[i], b = P[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 130) { ctx.strokeStyle = `rgba(110,190,255,${(1 - d / 130) * .14})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    for (const p of P) {
      const d = Math.hypot(mx - p.x, my - p.y);
            ctx.fillStyle = p.red ? 'rgba(255,70,76,.7)' : 'rgba(130,215,255,.65)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
  };
  return fxAdd(cv, draw, resize);
}

/* data streams: light trails rising through a dark field */
function streamFX(cv) {
  const ctx = cv.getContext('2d'); let S = { w: 1, h: 1, dpr: 1 }, T = [];
  const mk = (init) => ({ x: Math.random() * S.w, y: init ? Math.random() * S.h : S.h + Math.random() * 200, len: 80 + Math.random() * 200, v: .25 + Math.random() * .7, w: Math.random() < .15 ? 2 : 1, c: Math.random() < .12 ? '255,60,70' : Math.random() < .5 ? '82,214,255' : '120,150,255' });
  const resize = () => { S = sizeCanvas(cv); T = Array.from({ length: Math.round(S.w / 70) }, () => mk(true)); };
  const draw = (t) => {
    const { w, h, dpr } = S; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(120,160,255,.03)'; ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 44) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, h); ctx.stroke(); }
    const scan = (t / 30) % (h + 300) - 150;
    const sg = ctx.createLinearGradient(0, scan - 120, 0, scan + 120); sg.addColorStop(0, 'rgba(82,214,255,0)'); sg.addColorStop(.5, 'rgba(82,214,255,.025)'); sg.addColorStop(1, 'rgba(82,214,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, scan - 120, w, 240);
    for (const s of T) {
      s.y -= s.v; if (s.y + s.len < 0) Object.assign(s, mk(false));
      const g = ctx.createLinearGradient(0, s.y, 0, s.y + s.len); g.addColorStop(0, `rgba(${s.c},.45)`); g.addColorStop(1, `rgba(${s.c},0)`);
      ctx.strokeStyle = g; ctx.lineWidth = s.w; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y + s.len); ctx.stroke();
      ctx.fillStyle = `rgba(${s.c},.6)`; ctx.fillRect(s.x - s.w / 2, s.y - 1, s.w, 2);
    }
  };
  return fxAdd(cv, draw, resize);
}

let tiltEl = null;
if (FINE && !RM) document.addEventListener('pointermove', e => {

  if (tiltEl && tiltEl !== el) { tiltEl.style.removeProperty('--rx'); tiltEl.style.removeProperty('--ry'); }
  tiltEl = el; if (!el) return;
  const r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  el.style.setProperty('--rx', ((.5 - py) * 3).toFixed(2) + 'deg'); el.style.setProperty('--ry', ((px - .5) * 4).toFixed(2) + 'deg');
  el.style.setProperty('--gx', (px * 100).toFixed(1) + '%'); el.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
}, { passive: true });

let slideTimer = 0;
function heroSlider() {
  const hero = document.getElementById('hero'); if (!hero || !hero.querySelector('.slide')) return;
  const slides = [...hero.querySelectorAll('.slide')], btns = [...hero.querySelectorAll('#slidenav button')], cap = document.getElementById('slidecap');
  let k = 0;
  const show = n => {
    k = (n + slides.length) % slides.length;
    slides.forEach((s, i) => s.classList.toggle('on', i === k));
    btns.forEach((b, i) => { b.classList.remove('on'); if (i === k) { void b.offsetWidth; b.classList.add('on'); } });
    const [t, d] = btns[k].dataset.cap.split('|'); cap.innerHTML = `<b>${esc(t)}</b> · ${esc(d)}`;
  };
  btns.forEach((b, i) => b.onclick = () => { show(i); restart(); });
  const restart = () => { clearInterval(slideTimer); if (!RM) slideTimer = setInterval(() => show(k + 1), 8000); };
  restart();
}

let featTimer = 0;
function featured() {
  const box = document.getElementById('feattabs'); if (!box) return;
  const F = [
    { l:'Wire Harness & Electrification', img:'lumin-harness', bg:'eco-3', t:'Electrification engineered and built under one roof.', d:'From electrical architecture and harness design through automated, fully traceable manufacturing — wire harnesses, cable assemblies and electrical systems for industrial, transportation and aerospace applications.', r:'cap-harness' },
    { l:'AI & Enterprise Platforms', img:'hero-agentic', bg:'eco-1', t:'AI built as products, not pilots.', d:'Nexus AI, Voice AI Connector, Template IQ, IVR Crawler and G2C Connect — with evaluation, guardrails and enterprise integration built in.', r:'cap-ai' },

  ];

  const show = n => {
    k = (n + F.length) % F.length; const f = F[k];

/* dotted globe with sites, links and travelling packets */
function glowTex(r, g, b) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(.3, `rgba(${r},${g},${b},.5)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
/* placeholder office illustration (until real photos arrive) */
let oaN = 0;
function officeArt(p) {
  const R = rng(p.n), W = 320, H = 160, id = 'oa' + (++oaN);
  let s = '<svg viewBox="0 0 320 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B3A72"/><stop offset="1" stop-color="#0A1224"/></linearGradient></defs><rect width="320" height="160" fill="url(#' + id + ')"/>';
  for (let i = 0; i < 18; i++) s += '<circle cx="' + (R() * W).toFixed(0) + '" cy="' + (R() * 50).toFixed(0) + '" r="' + (R() * .9 + .3).toFixed(1) + '" fill="#fff" opacity="' + (R() * .6 + .2).toFixed(2) + '"/>';
  let x = -4; while (x < W) { const w = 16 + R() * 26, h = 36 + R() * 58; s += '<rect x="' + x.toFixed(0) + '" y="' + (H - h).toFixed(0) + '" width="' + w.toFixed(0) + '" height="' + h.toFixed(0) + '" fill="#132749"/>'; x += w + 3; }
  x = -10; while (x < W) { const w = 22 + R() * 30, h = 24 + R() * 40; s += '<rect x="' + x.toFixed(0) + '" y="' + (H - h).toFixed(0) + '" width="' + w.toFixed(0) + '" height="' + h.toFixed(0) + '" fill="#0F1F3C"/>'; for (let wy = H - h + 6; wy < H - 8; wy += 9) for (let wx = x + 4; wx < x + w - 5; wx += 8) if (R() > .6) s += '<rect x="' + wx.toFixed(0) + '" y="' + wy.toFixed(0) + '" width="4" height="4" fill="#FFD27A" opacity=".55"/>'; x += w + 4; }
  const tx = 112, tw = 96, th = 126 - (p.ty === 'hq' ? 0 : 14);
  s += '<rect x="' + tx + '" y="' + (H - th) + '" width="' + tw + '" height="' + th + '" fill="#1E3F78"/><rect x="' + tx + '" y="' + (H - th) + '" width="' + tw + '" height="5" fill="#E01B22"/>';
  for (let wy = H - th + 12; wy < H - 10; wy += 8) for (let wx = tx + 6; wx < tx + tw - 6; wx += 9) s += '<rect x="' + wx + '" y="' + wy + '" width="6" height="4" fill="#52D6FF" opacity="' + (R() * .6 + .12).toFixed(2) + '"/>';
  s += '<text x="' + (tx + tw / 2) + '" y="' + (H - th + 16) + '" text-anchor="middle" font-family="Manrope,sans-serif" font-size="8" font-weight="800" letter-spacing="1.5" fill="#fff">INTELLECTT</text>';
  s += '<rect y="' + (H - 5) + '" width="320" height="5" fill="#070B14"/></svg>';
  return s;
}

/* 3D city view: MapLibre + OpenFreeMap (free, no API key), loaded only when opened */
const CITY3D = { lib: null, map: null };
function loadMapLib() {
  if (window.maplibregl) return Promise.resolve(window.maplibregl);
  if (CITY3D.lib) return CITY3D.lib;
  CITY3D.lib = new Promise((res, rej) => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css'; document.head.appendChild(l);
    const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js';
    sc.onload = () => window.maplibregl ? res(window.maplibregl) : rej(); sc.onerror = () => { CITY3D.lib = null; rej(); };
    document.head.appendChild(sc);
  });
  return CITY3D.lib;
}
function close3D() {
  const ov = document.getElementById('city3d'); if (!ov) return;
  ov.hidden = true; document.body.style.overflow = '';
  if (CITY3D.map) { try { CITY3D.map.remove(); } catch (e) {} CITY3D.map = null; }
  if (CITY3D.back) CITY3D.back.focus?.();
}
function open3D(p) {
  const name = p.n.replace(' (HQ)', '');
  let ov = document.getElementById('city3d');
  if (!ov) {
    ov = document.createElement('section'); ov.id = 'city3d'; ov.hidden = true; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', '3D city view');
    ov.innerHTML = '<div class="c3-h"><div><small>3D city view</small><b id="c3n"></b></div><div class="c3-tools"><a id="c3dir" class="btn btn-line btn-sm" target="_blank" rel="noopener">Directions</a><button type="button" class="c3-x" id="c3x" aria-label="Close 3D view">&times;</button></div></div>'
      + '<div id="c3map"></div><div class="c3-load" id="c3load"></div><div class="c3-tip">Drag to move · Right-drag or two fingers to tilt and turn · Scroll to zoom</div>';
    document.body.appendChild(ov);
    ov.querySelector('#c3x').onclick = close3D;
    addEventListener('keydown', e => { if (e.key === 'Escape' && !ov.hidden) close3D(); });
  }
  CITY3D.back = document.activeElement;
  ov.querySelector('#c3n').textContent = 'Intellectt ' + name;
  ov.querySelector('#c3dir').href = 'https://www.google.com/maps/search/?api=1&query=' + p.la + ',' + p.lo;
  const load = ov.querySelector('#c3load');
  load.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span> Flying to ' + esc(name) + '…'; load.hidden = false;
  ov.hidden = false; document.body.style.overflow = 'hidden'; ov.querySelector('#c3x').focus();
  const fail = () => {
    load.hidden = false;
    load.innerHTML = '<b>The 3D map could not load here.</b><span>It works on the live website. You can also open this spot in Google Maps 3D.</span>'
      + '<a class="btn btn-red btn-sm" target="_blank" rel="noopener" href="https://www.google.com/maps/@' + p.la + ',' + p.lo + ',700a,35y,20h,60t/data=!3m1!1e3">Open Google Maps 3D ' + ARROW + '</a>';
  };
  loadMapLib().then(ml => {
    if (ov.hidden) return;
    if (CITY3D.map) { try { CITY3D.map.remove(); } catch (e) {} }
    let map;
    try {
      map = new ml.Map({ container: 'c3map', style: 'https://tiles.openfreemap.org/styles/liberty', center: [p.lo, p.la], zoom: 3.2, pitch: 0, bearing: 0, attributionControl: { compact: true }, maxPitch: 75 });
    } catch (e) { fail(); return; }
    CITY3D.map = map;
    map.addControl(new ml.NavigationControl({ visualizePitch: true }), 'bottom-right');
    let ok = false, spin = !RM;
    const timer = setTimeout(() => { if (!ok) fail(); }, 12000);
    const stop = () => { spin = false; };
    map.on('mousedown', stop); map.on('touchstart', stop); map.on('wheel', stop);
    map.once('load', () => {
      ok = true; clearTimeout(timer); load.hidden = true;
      const st = map.getStyle();
      if (!st.layers.some(l => l.type === 'fill-extrusion')) {
        const src = Object.keys(st.sources).find(k => st.sources[k].type === 'vector');
        if (src) map.addLayer({ id: 'c3-bld', type: 'fill-extrusion', source: src, 'source-layer': 'building', minzoom: 14, paint: { 'fill-extrusion-color': '#C9D3E3', 'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 12], 'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0], 'fill-extrusion-opacity': .9 } });
      }
      const el = document.createElement('div'); el.className = 'c3-pin'; el.innerHTML = '<span>Intellectt ' + esc(name) + '</span>';
      new ml.Marker({ element: el, anchor: 'bottom' }).setLngLat([p.lo, p.la]).addTo(map);
      map.on('moveend', () => { if (spin && CITY3D.map === map) map.rotateTo(map.getBearing() + 10, { duration: 5000, easing: t => t }); });
      map.flyTo({ center: [p.lo, p.la], zoom: 16.3, pitch: 62, bearing: -25, duration: RM ? 0 : 6500, essential: true });
    });
  }).catch(fail);
}

  t.replace(/\r/g, '').split(/\n{2,}/).forEach(par => {

      if (line.trim()) out.push('<p>' + inl(line) + '</p>');

  });

}

    const draw = (t) => {
      t = (t || 0) / 1000;
      const rc = canvas.getBoundingClientRect();
      const yaw = Math.max(-.7, Math.min(.7, (MOUSE.x - (rc.left + rc.width / 2)) / 500)), pitch = Math.max(-.3, Math.min(.4, (MOUSE.y - (rc.top + rc.height / 2)) / 600));
      rb.H.rotation.y += ((MOUSE.x < -1000 ? Math.sin(t) * .3 : yaw) - rb.H.rotation.y) * .1; rb.H.rotation.x += (pitch - rb.H.rotation.x) * .1;
      rb.B.position.y = Math.sin(t * 1.8) * .04;
      blink -= 1 / 60; if (blink < -.12) blink = 2 + Math.random() * 3;
      rb.eyes.forEach(e => e.scale.y = blink < 0 ? .1 : 1.05);
      rb.M.ear.emissiveIntensity = (st.talk > 0 ? 1.6 + Math.sin(t * 16) * .8 : 1.1 + Math.sin(t * 2.4) * .25);
      rb.mouth.visible = st.talk > 0; if (st.talk > 0) rb.bars.forEach((b, i) => b.scale.y = .35 + Math.abs(Math.sin(t * 15 + i * 1.3) * Math.cos(t * 7 + i)) * 1.5);
      if (!frameHead) { rb.R.Sh.rotation.z = 2.6 + Math.sin(t * 2) * .1; rb.R.El.rotation.z = Math.sin(t * 6) * .5; }
      r.render(sc, c);
    };
    return { draw, dispose: () => r.dispose() };
  }
  const Avatar = (() => { const c = document.getElementById('avc'); let b = null; return { draw(t) { if (document.getElementById('chat').hidden) return; if (!b) b = smallBot(c, true); b.draw(t * 1000); } }; })();

  const HINTS = ['Hi there! How may I help you?', 'Looking for talent? Describe the role and I’ll shape a brief.', 'Ask me about harnesses, AI platforms or medical displays.', 'You can drag me anywhere on the page.', 'Double-click me for a little jump.', 'Job hunting? I can point you to the CV matcher.'];
  const ROUTE_LINES = r => r === 'home' ? 'Hi there! How may I help you?'
    : r === 'find-talent' ? 'Describe the role in your own words — I’ll help shape the brief.'
    : r === 'careers-openings' ? 'Paste your CV and I’ll show you the roles that fit.'
    : r === 'contact' ? 'Tell us what you need and I’ll route it to the right team.'
    : 'Questions about ' + (TITLES[r] || 'this page') + '? Ask me.';

  API.onRoute = r => { if (!st.parked) setTimeout(() => speak(ROUTE_LINES(r)), 900); };
  API.mini = c => { const b = smallBot(c, false); const f = fxAdd(c, b.draw); f.dispose = b.dispose; };
  API.talk = (s = 1.2) => { st.talk = Math.max(st.talk, s); };
  API.park = () => { st.parked = true; say.classList.remove('on'); const px = innerWidth - Math.min(420, innerWidth - 32) - 20 - W + 10; if (px < 8) { el.style.opacity = 0; el.style.pointerEvents = 'none'; return; } st.tx = px; st.mode = st.mode === 'idle' ? 'walk' : st.mode; };
  API.unpark = () => { st.parked = false; el.style.opacity = ''; el.style.pointerEvents = ''; st.next = 2; };
  API.react = () => { st.happy = 1.5; st.wave = 1.2; };
  API.badge = on => { if (badge) badge.hidden = !on; if (on) { st.happy = 2; speak('I’ve answered your question — click me to read it.', 4000); } };
  API.wake = () => { lastAct = performance.now(); if (st.sleep) { st.sleep = false; st.wake = 1.2; } };
  setTimeout(() => speak('Hi there! How may I help you?', 6000), 1400);
  API.buildRobot = buildRobot; API.envFor = envFor;
  return API;
})();

/* ---------- light / dark ---------- */
(() => {
  const root = document.documentElement, btn = document.getElementById('themeT'), mq = matchMedia('(prefers-color-scheme: dark)');
  let pref = null; try { pref = localStorage.getItem('ic-theme'); } catch (e) {}
  const eff = () => pref || 'light';   // light by default; visitors can still switch
  const apply = () => { const d = eff() === 'dark'; root.classList.toggle('dk', d); root.style.colorScheme = d ? 'dark' : 'light'; btn.setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode'); btn.title = btn.getAttribute('aria-label'); };
  mq.addEventListener && mq.addEventListener('change', apply);
  new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  btn.onclick = () => { pref = eff() === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('ic-theme', pref); } catch (e) {} apply(); };
  apply();
})();
buildChrome(); go(); addEventListener("hashchange", go);
