<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Intellectt Website</title>
<meta name="description" content="Intellectt brings engineering, manufacturing, data and enterprise technology together to help businesses design, build and scale what matters.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preload" as="image" href="img/home-cad.webp" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
</head><body>
<style>
:root{
  color-scheme: light;
  --ink:#0B0D12; --ink-2:#394050; --muted:#5B6372; --line:#E3E7ED; --mist:#F4F6F9; --paper:#FFFFFF;
  --red:#E01B22; --red-d:#B9141A; --navy:#2F55A4; --sky:#1592D2; --glow:#52D6FF; --night:#070B14; --night-2:#0E1524;
  --gold:#FFC21A;
  --card:#FFFFFF; --soft:#EEF3FB; --line-2:#CFD7E2; --hdr:rgba(255,255,255,.86); --dotc:#CBD3DF; --gridc:#E9EDF3;
  --font:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --wrap:1200px; --gut:clamp(16px,4vw,40px);
  --r:14px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.12}
p{margin:0}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gut)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
.dark .eyebrow{color:var(--glow)}
.lead{font-size:clamp(17px,1.6vw,19px);line-height:1.65;color:var(--ink-2);max-width:62ch}
.dark .lead,.hero .lead,.phero .lead,.cta .lead{color:#C8D0DE}
.hero .eyebrow,.phero .eyebrow{color:var(--glow)}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding-inline:24px;border-radius:10px;font-weight:700;font-size:15px;border:1.5px solid transparent;cursor:pointer;transition:transform .25s var(--ease),background .25s,box-shadow .25s;white-space:nowrap;background:none}
.btn svg{width:16px;height:16px;transition:transform .25s var(--ease)}
.btn:hover svg{transform:translateX(3px)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 10px 24px -10px rgba(224,27,34,.7)}
.btn-red:hover{background:var(--red-d);transform:translateY(-2px)}
.btn-line{border-color:currentColor}
.btn-line:hover{transform:translateY(-2px)}
.btn-sm{height:40px;padding-inline:16px;font-size:14px;border-radius:8px}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--navy)}
.dark .link{color:var(--glow)}
.link svg{width:14px;height:14px;transition:transform .25s var(--ease)}
.link:hover svg{transform:translateX(4px)}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(227,231,237,.8)}
.hdr-in{display:flex;align-items:center;gap:36px;height:78px}
.logo img{height:46px;width:auto}
.nav{display:flex;gap:4px;flex:1}
.nav>.ni{position:static}
.nav>.ni>a{display:flex;align-items:center;gap:6px;height:78px;padding-inline:10px;font-weight:600;font-size:15px;position:relative;white-space:nowrap}
.nav>.ni>a::after{content:"";position:absolute;left:12px;right:12px;bottom:18px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.nav>.ni:hover>a::after,.nav>.ni.on>a::after,.nav>.ni:focus-within>a::after{transform:scaleX(1)}
.nav svg{width:10px;height:10px}
.mega{position:absolute;left:0;right:0;top:78px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(11,13,18,.35);opacity:0;visibility:hidden;transform:translateY(-8px);transition:.25s var(--ease)}
.ni:hover .mega,.ni:focus-within .mega{opacity:1;visibility:visible;transform:none}
.mega-in{display:grid;grid-template-columns:1fr 1fr 320px;gap:8px 40px;padding-block:32px}
.mega a.ml{display:block;padding:12px 14px;border-radius:10px;transition:background .2s}
.mega a.ml:hover{background:var(--mist)}
.mega a.ml b{display:block;font-size:15px}
.mega a.ml span{font-size:13px;color:var(--muted)}
.mega-feat{grid-row:span 4;border-radius:14px;overflow:hidden;position:relative;min-height:260px;color:#fff;display:flex;align-items:flex-end;padding:20px}
.mega-feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 6s linear}
.mega-feat:hover img{transform:scale(1.08)}
.mega-feat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,20,0) 30%,rgba(7,11,20,.85));z-index:1}
.mega-feat div{position:relative;z-index:2}
.hdr-cta{margin-left:auto}
.burger{display:none;margin-left:auto;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}
@media (max-width:1180px){
  .nav,.hdr-cta{display:none}.burger{display:flex}
  .mnav{position:fixed;inset:78px 0 0 0;background:var(--card);z-index:59;overflow:auto;padding:16px var(--gut) 40px}
  .mnav.open{display:block}
  .mnav details{border-bottom:1px solid var(--line)}
  .mnav summary{padding:16px 0;font-weight:700;font-size:18px;cursor:pointer;list-style:none}
  .mnav a{display:block;padding:10px 0 10px 12px;color:var(--ink-2)}
}

/* ---------- sections & live backgrounds ---------- */
.sec{position:relative;isolation:isolate;overflow:hidden;padding-block:clamp(64px,9vw,120px)}
.sec.mist{background:var(--mist)}
.dark{background:var(--night);color:#fff}
.fx{position:absolute;inset:0;z-index:-1;pointer-events:none}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
/* blueprint grid that drifts, with a slow light sweep */
.fx-grid{background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:56px 56px;animation:gridDrift 120s linear infinite;-webkit-mask-image:radial-gradient(ellipse 70% 80% at var(--mx,80%) var(--my,20%),#000 0%,transparent 70%);mask-image:radial-gradient(ellipse 70% 80% at var(--mx,80%) var(--my,20%),#000 0%,transparent 70%)}
.dark .fx-grid{--gridc:rgba(120,170,255,.08)!important}
@keyframes gridDrift{to{background-position:56px 56px,56px 56px}}

@keyframes sweep{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.fx-dots{background-image:radial-gradient(circle,var(--dotc) 1.2px,transparent 1.6px);background-size:22px 22px;animation:gridDrift 60s linear infinite reverse;-webkit-mask-image:radial-gradient(ellipse 60% 80% at var(--mx,10%) var(--my,90%),#000,transparent 70%);mask-image:radial-gradient(ellipse 60% 80% at var(--mx,10%) var(--my,90%),#000,transparent 70%)}
.fx-glow{position:absolute;width:640px;height:640px;border-radius:50%;filter:blur(90px);opacity:.22;animation:float 40s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(80px,-40px)}66%{transform:translate(-60px,50px)}}
.orbits{position:absolute;pointer-events:none}
.orbits g{transform-box:view-box;transform-origin:50% 50%;animation:spin 200s linear infinite}
.orbits g.b{animation-duration:260s;animation-direction:reverse}
.orbits g.c{animation-duration:320s}
@keyframes spin{to{transform:rotate(360deg)}}
.fx-photo{position:absolute;inset:0;z-index:-2}
.fx-photo img{width:100%;height:100%;object-fit:cover;animation:kb 40s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.01)}to{transform:scale(1.07) translate(-1%,-.5%)}}
.fx-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(7,11,20,.92) 0%,rgba(7,11,20,.72) 45%,rgba(7,11,20,.35) 100%)}

/* ---------- home hero ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;background:var(--night);color:#fff;min-height:clamp(540px,86vh,740px);display:flex;align-items:flex-end}
.slides{position:absolute;inset:0;z-index:-3}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
.slide.on img{animation:kb 16s ease-out forwards}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(7,11,20,.94) 0%,rgba(7,11,20,.78) 42%,rgba(7,11,20,.25) 100%),linear-gradient(0deg,rgba(7,11,20,.9),transparent 45%)}
.hero .fx{z-index:-1}
.hero-in{padding-block:clamp(88px,12vw,120px) clamp(40px,6vw,72px);width:100%}
.hero h1{font-size:clamp(40px,6.2vw,80px);font-weight:800;letter-spacing:-.035em;line-height:1.02;max-width:14ch}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#fff,#9FDFFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{margin-top:22px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:clamp(32px,6vw,64px);flex-wrap:wrap}
.slide-nav{display:flex;gap:10px;align-items:center}
.slide-nav button{width:44px;height:6px;border-radius:3px;border:none;background:rgba(255,255,255,.25);cursor:pointer;position:relative;overflow:hidden;padding:0}
.slide-nav button.on::after{content:"";position:absolute;inset:0;background:var(--card);transform-origin:left;animation:bar 8s linear forwards}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.slide-cap{font-size:13px;color:#AFC0D8;font-weight:600;letter-spacing:.04em}
.slide-cap b{color:#fff}

.strip{background:var(--night-2);color:#DDE6F3;font-size:14px;font-weight:600}
.strip-in{display:flex;gap:28px;justify-content:center;align-items:center;flex-wrap:wrap;padding-block:18px}
.strip i{width:5px;height:5px;border-radius:50%;background:var(--red);display:inline-block}

/* ---------- page hero ---------- */
.phero{position:relative;isolation:isolate;overflow:hidden;background:var(--night);color:#fff}
.phero-in{padding-block:clamp(72px,10vw,128px) clamp(56px,7vw,88px);display:grid;gap:22px;max-width:760px}
.crumb{font-size:13px;color:#A9B7CC;font-weight:600}
.crumb a:hover{color:#fff}
.phero h1{font-size:clamp(36px,5vw,62px);font-weight:800;letter-spacing:-.03em}
.phero .hero-cta{margin-top:10px}

/* ---------- headings ---------- */
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:44px;flex-wrap:wrap}
.sh h2{font-size:clamp(28px,3.6vw,44px);font-weight:800;max-width:22ch}
.sh .lead{margin-top:12px}

/* ---------- cards: image cards with tilt, glow and sheen ---------- */
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0));transition:transform .5s var(--ease),box-shadow .5s var(--ease);will-change:transform}
.tilt:hover{--ty:-4px;box-shadow:0 30px 60px -30px rgba(11,13,18,.45)}
.icard{position:relative;border-radius:var(--r);overflow:hidden;background:var(--night);color:#fff;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
.icard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.2s var(--ease)}
.icard:hover img{transform:scale(1.08)}
.icard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,11,20,.05) 20%,rgba(7,11,20,.88) 100%)}
.icard::after,.tcard::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--gx,50%) var(--gy,50%),rgba(82,214,255,.18),transparent 45%);opacity:0;transition:opacity .4s}
.icard:hover::after,.tcard:hover::after{opacity:1}
.icard .ib{padding:24px;display:grid;gap:8px}
.icard h3{font-size:22px;font-weight:800}
.icard p{font-size:14.5px;color:#D3DBE8;line-height:1.55}
.icard .sheen{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(-120%)}
.icard:hover .sheen{animation:sheen 1.1s var(--ease)}
@keyframes sheen{to{transform:translateX(120%)}}
.icard.short{min-height:260px}
/* text cards: animated border glow and drifting dots */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
.tcard{position:relative;border-radius:var(--r);padding:28px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;overflow:hidden;isolation:isolate}
.tcard::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang),transparent 0 70%,var(--sky) 80%,var(--red) 88%,transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .4s;animation:ang 4s linear infinite}
.tcard:hover::before{opacity:1}
@keyframes ang{to{--ang:360deg}}
.tcard .dots{position:absolute;right:-20px;top:-20px;width:160px;height:160px;z-index:-1;background-image:radial-gradient(circle,var(--dotc) 1.1px,transparent 1.4px);background-size:12px 12px;-webkit-mask-image:radial-gradient(circle at 70% 30%,#000,transparent 70%);mask-image:radial-gradient(circle at 70% 30%,#000,transparent 70%);animation:gridDrift 30s linear infinite}
.tcard h3{font-size:19px;font-weight:800;line-height:1.3}
.tcard p{font-size:15px;color:var(--ink-2);line-height:1.6}
.tcard .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--navy);margin-bottom:6px}
.tcard .ico svg{width:22px;height:22px}
.tcard .foot{margin-top:auto;padding-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.dark .tcard{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);backdrop-filter:blur(6px)}
.dark .tcard p{color:#BFC9D8}
.dark .tcard .ico{background:rgba(82,214,255,.12);color:var(--glow)}
.dark .tcard .dots{background-image:radial-gradient(circle,rgba(140,190,255,.25) 1.1px,transparent 1.4px)}

/* statement */
.stmt{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(32px,6vw,96px);align-items:start}
.stmt p.big{font-size:clamp(21px,2.3vw,28px);line-height:1.45;font-weight:600;letter-spacing:-.01em}
.stmt p.big+p.big{margin-top:18px}
.aside{border-top:2px solid var(--ink);padding-top:14px}
.aside b{display:block;font-size:14px;margin-bottom:6px}
.aside div{padding:13px 0;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:10px}
.aside div::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
@media (max-width:860px){.stmt{grid-template-columns:1fr}}
.pending{border:1.5px dashed var(--line-2);border-radius:12px;padding:18px 20px;color:var(--muted);font-size:15px;background:var(--card)}

/* steps with a travelling pulse */
.steps{position:relative;display:grid;gap:28px 16px}
.steps .rail{position:absolute;left:0;right:0;top:13px;height:2px;background:var(--line-2);overflow:hidden}
.steps .rail::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,var(--red),transparent);animation:rail 3.6s linear infinite}
@keyframes rail{from{left:-30%}to{left:100%}}
.step{position:relative;display:grid;gap:14px;padding-right:10px}
.step i{width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--navy);display:grid;place-items:center}
.step i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--navy)}
.step:last-child i{border-color:var(--red)}.step:last-child i::after{background:var(--red)}
.step b{font-size:16.5px;line-height:1.3}
.dark .steps .rail{background:rgba(255,255,255,.15)}
.dark .step i{background:var(--night)}
@media (max-width:760px){.steps{grid-template-columns:1fr!important}.steps .rail{display:none}.step{grid-template-columns:28px 1fr;align-items:center}}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;height:42px;padding-inline:16px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:14.5px;transition:.25s}
.chip:hover{border-color:var(--ink);transform:translateY(-2px)}
.dark .chip{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.18);color:#fff}

/* marquee logos */
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq-track{display:flex;gap:18px;width:max-content;animation:mq 60s linear infinite}
.marquee:hover .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.logo-t{width:180px;height:92px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:16px;flex:0 0 auto}
.logo-t img{max-height:56px;width:auto;object-fit:contain;filter:grayscale(1) contrast(.9);opacity:.75;transition:.3s}
.logo-t:hover img{filter:none;opacity:1}

/* proof */
.proof{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media (max-width:860px){.proof{grid-template-columns:1fr}}
.quote{border-radius:var(--r);background:var(--mist);padding:32px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.quote .q{font-size:64px;line-height:.6;font-weight:800;color:var(--red)}

/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 0;border-bottom:2px solid var(--ink)}
.tbl td{padding:18px 16px 18px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;width:34%}
.tbl tr{transition:background .2s}.tbl tbody tr:hover{background:var(--mist)}

/* faq */
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;padding:22px 0;font-weight:700;font-size:17px}
.faq summary::after{content:"+";font-size:24px;line-height:1;transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding-bottom:22px;color:var(--ink-2);max-width:70ch}

/* cta band */
.cta{background:var(--night);color:#fff}
.cta h2{font-size:clamp(30px,4vw,50px);font-weight:800;max-width:20ch}
.cta .hero-cta{margin-top:30px}

/* ask band */
.askband{border-radius:20px;padding:clamp(22px,3vw,32px);background:linear-gradient(135deg,#0E1830,#12264A);color:#fff;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;position:relative;overflow:hidden;isolation:isolate}
.askband .mini{width:96px;height:96px}
.askform{display:flex;gap:10px;margin-top:14px}
.askform input{flex:1;height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);padding-inline:16px;color:#fff}
.askform input::placeholder{color:#AFBCD1}
.askq{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.askq button{height:36px;padding-inline:14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer}
.askq button:hover{background:rgba(255,255,255,.14)}
@media (max-width:640px){.askband{grid-template-columns:1fr}.askform{flex-direction:column}}

/* brief builder / forms */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,32px);box-shadow:0 30px 60px -40px rgba(11,13,18,.35)}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field textarea,.field select{border:1.5px solid var(--line-2);border-radius:10px;padding:12px 14px;background:var(--card);color:var(--ink);transition:border .2s;width:100%}
.field textarea{min-height:130px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(47,85,164,.12)}
.brow{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #F0F2F5;font-size:15px}
.brow span{color:var(--muted);font-weight:600}
.brow b{font-weight:700}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--navy)}
.tag.ok{background:#E8F7EF;color:#17804A}
.note{font-size:13px;color:var(--muted)}
.thinking{display:inline-flex;gap:5px;align-items:center}
.thinking i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.3;animation:dot 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes dot{40%{opacity:1}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{height:38px;padding-inline:14px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:13.5px;cursor:pointer;transition:.2s}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.job{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.job b{font-size:17px}
.drop{border:1.5px dashed #9AA6B6;border-radius:14px;padding:22px;text-align:center;color:var(--ink-2);background:var(--mist);cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--navy);background:var(--soft)}

/* globe */
.globe-wrap{position:relative;aspect-ratio:1/1;max-width:560px;width:100%;margin-inline:auto}
.globe-wrap canvas{width:100%!important;height:100%!important}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;font-weight:600;color:#C8D2E2}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
.region{padding:18px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.region b{font-size:18px}
.region p{color:#AFBBCD;font-size:14px;margin-top:4px}

/* footer */
.ftr{background:var(--mist);border-top:1px solid var(--line);padding-block:72px 32px;font-size:14px}
.ftr-g{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:32px}
.ftr h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
.ftr a{display:block;color:var(--ink-2);padding:4px 0}
.ftr a:hover{color:var(--red)}
.ftr-b{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:48px;padding-top:22px;border-top:1px solid var(--line-2);color:var(--muted);font-size:13px}
@media (max-width:900px){.ftr-g{grid-template-columns:1fr 1fr}}

/* reveal on scroll (visible at rest; slides up slightly) */
.rv{transition:transform .9s var(--ease),opacity .9s var(--ease)}
.rv.pre{transform:translateY(28px)}

/* ---------- robot assistant ---------- */
#bot{position:fixed;left:0;top:0;z-index:80;width:170px;height:200px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#bot.drag{cursor:grabbing}
#bot canvas{width:170px;height:200px;display:block;filter:drop-shadow(0 18px 18px rgba(7,11,20,.28))}
#bot .shadow{position:absolute;left:50%;bottom:6px;width:90px;height:14px;margin-left:-45px;border-radius:50%;background:radial-gradient(rgba(7,11,20,.35),transparent 70%);transition:transform .2s}
#say{position:fixed;z-index:81;max-width:250px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.45;font-weight:600;box-shadow:0 20px 40px -18px rgba(7,11,20,.45);pointer-events:auto;cursor:pointer;opacity:0;transform:translateY(6px) scale(.96);transition:opacity .35s,transform .35s var(--ease)}
#say.on{opacity:1;transform:none}
#say small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin-bottom:3px}

/* chat window */
#chat{position:fixed;right:20px;bottom:20px;z-index:90;width:min(420px,calc(100vw - 32px));height:min(640px,calc(100dvh - 40px));background:var(--card);border-radius:22px;box-shadow:0 40px 80px -30px rgba(7,11,20,.55),0 0 0 1px rgba(11,13,18,.06);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;transition:transform .45s var(--ease),opacity .35s}
#chat[hidden]{display:flex!important;opacity:0;transform:scale(.6) translateY(40px);pointer-events:none}
.ch-h{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(135deg,#0B1222,#16284C);color:#fff;position:relative;overflow:hidden}
.ch-h .av{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.ch-h .av canvas{width:48px!important;height:48px!important}
.ch-h b{display:block;font-size:16px}
.ch-h small{display:flex;align-items:center;gap:6px;color:#B7C3D6;font-size:12px}
.ch-h small i{width:7px;height:7px;border-radius:50%;background:#3CCB7F}
.ch-x{margin-left:auto;width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center}
.ch-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--mist);scroll-behavior:smooth}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.msg.bot{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--ink);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.msg .go{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;white-space:normal}
.msg .go a{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--navy);font-weight:700;font-size:13px;line-height:1.2;white-space:nowrap}
.msg .go a svg{width:13px;height:13px;flex-shrink:0}
.msg .go a:hover{background:#DFE8F8}
.ch-q{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0;background:var(--card);border-top:1px solid var(--line)}
.ch-q button{height:32px;padding-inline:12px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:13px;font-weight:600;cursor:pointer}
.ch-q button:hover{border-color:var(--ink)}
.ch-f{display:flex;gap:8px;padding:12px 14px 14px;background:var(--card)}
.ch-f input{flex:1;min-width:0;height:48px;border-radius:12px;border:1.5px solid var(--line-2);padding-inline:14px;background:var(--card);color:var(--ink)}
.ch-f input::placeholder{color:#8A93A3}
.ch-f input:focus{outline:none;border-color:var(--navy)}
.ch-f button{width:48px;height:48px;border-radius:12px;border:none;background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center}
.ch-f button:disabled{opacity:.5}
.ch-n{font-size:11px;color:var(--muted);padding:0 16px 10px;background:var(--card)}
/* --- realistic bot extras --- */
#botshadow{position:fixed;left:0;top:0;z-index:79;width:110px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(7,11,20,.45),rgba(7,11,20,.18) 55%,transparent);opacity:0;pointer-events:none;filter:blur(2px);will-change:transform,opacity}
.dk #botshadow{background:radial-gradient(closest-side,rgba(0,0,0,.75),rgba(0,0,0,.3) 55%,transparent)}
#botbadge{position:absolute;top:26px;right:34px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 3px var(--paper),0 6px 14px -4px rgba(224,27,34,.6);animation:bdg 1.6s var(--ease) infinite}
#botbadge[hidden]{display:none}
@keyframes bdg{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#bot canvas{filter:drop-shadow(0 6px 6px rgba(7,11,20,.18)) drop-shadow(0 22px 22px rgba(7,11,20,.22))}
/* --- full chat --- */
.ch-id{min-width:0;flex:1}
.ch-id b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
.ch-q[hidden]{display:none}
#chat .ch-h{gap:10px;padding:12px 12px 12px 14px}
#chat .ch-h .av{width:42px;height:42px}
#chat .ch-h .av canvas{width:42px!important;height:42px!important}
.ch-id small span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-tools{margin-left:auto;display:flex;gap:4px;flex:0 0 auto}
.ch-tools .ch-x{margin:0;width:32px;height:32px;transition:background .2s}
.ch-tools .ch-x:hover{background:rgba(255,255,255,.12)}
.ch-h small i.busy{background:#F5B83D;animation:bdg 1s infinite}
#chat.big{width:min(760px,calc(100vw - 40px));height:calc(100dvh - 40px)}
.ch-b{gap:4px;position:relative}
.row{display:flex;flex-direction:column;align-items:flex-start;margin-top:10px;animation:pop .35s var(--ease)}
.row.me{align-items:flex-end}
.row .msg{white-space:normal;max-width:92%;animation:none;box-shadow:0 1px 2px rgba(7,11,20,.05),0 6px 16px -10px rgba(7,11,20,.25)}
.row .msg.bot{position:relative}
.msg p{margin:0 0 .5em}.msg p:last-child{margin:0}
.msg ul{margin:.3em 0 .5em;padding-left:1.2em;white-space:normal}.msg li{margin:.15em 0}
.msg b{font-weight:800}
.msg .cur{display:inline-block;width:7px;height:1em;vertical-align:-2px;margin-left:2px;background:var(--navy);animation:blinkc .9s steps(2) infinite}
@keyframes blinkc{50%{opacity:0}}
.meta{display:flex;align-items:center;gap:2px;margin-top:4px;font-size:11px;color:var(--muted);min-height:26px}
.meta time{padding:0 6px 0 4px}
.meta button{width:26px;height:26px;border-radius:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:.75}
.meta button:hover{background:var(--soft);color:var(--ink);opacity:1}
.meta button[aria-pressed="true"]{color:var(--navy);opacity:1;background:var(--soft)}
.meta .ok{color:#1E9E5A;font-weight:700;padding-left:4px}
.next{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-width:92%}
.next button{min-height:32px;padding:5px 12px;border-radius:999px;border:1px dashed var(--line-2);background:var(--card);color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left}
.next button:hover{border-style:solid;border-color:var(--navy);color:var(--navy)}
.day{align-self:center;margin:8px 0 2px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.handoff{display:grid;gap:8px;margin-top:10px;white-space:normal}
.handoff input,.handoff textarea{width:100%;border:1.5px solid var(--line-2);border-radius:10px;padding:9px 11px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;resize:vertical}
.handoff input:focus,.handoff textarea:focus{outline:none;border-color:var(--navy)}
.handoff button{justify-self:start;height:38px;padding:0 16px;border-radius:10px;border:none;background:var(--red);color:#fff;font-weight:700;cursor:pointer}
.ch-down{position:absolute;right:18px;bottom:150px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 10px 24px -10px rgba(7,11,20,.45);cursor:pointer;display:grid;place-items:center}
.ch-down[hidden]{display:none}
.ch-f{align-items:flex-end}
.ch-f textarea{flex:1;min-width:0;min-height:48px;max-height:140px;border-radius:12px;border:1.5px solid var(--line-2);padding:13px 14px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;line-height:1.4;resize:none;overflow-y:auto}
.ch-f textarea::placeholder{color:#8A93A3}
.ch-f textarea:focus{outline:none;border-color:var(--navy)}
.ch-f #chstop{background:var(--ink);color:var(--paper)}
.ch-f button[hidden]{display:none}
.msg .thinking{height:18px;gap:4px}
.msg .thinking i{background:var(--muted);opacity:1;animation:thk 1.2s infinite}
.msg .thinking i:nth-child(2){animation-delay:.15s}.msg .thinking i:nth-child(3){animation-delay:.3s}
@keyframes thk{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
@media (max-width:640px){.ch-hide-sm{display:none!important}.ch-down{bottom:140px}}



/* ---------- code-drawn artwork ---------- */
.art{position:absolute;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(120% 100% at 75% 15%,#173263 0%,#0C1830 50%,#070B14 100%)}
.art svg{width:100%;height:100%;display:block;transition:transform 1.4s var(--ease)}
.icard:hover .art svg,.mega-feat:hover .art svg{transform:scale(1.05)}
.phero,.hero{background:radial-gradient(90% 120% at 85% 10%,#132A55 0%,#0A1224 48%,#070B14 100%)}
.phero-art{position:absolute;right:-20px;top:0;bottom:0;width:min(58%,760px);z-index:-1;opacity:.6;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.phero-art svg{width:100%;height:100%}
.hero-art{opacity:.75}
.hero::before{background:linear-gradient(90deg,rgba(7,11,20,.7) 0%,rgba(7,11,20,.3) 55%,rgba(7,11,20,0) 100%)}
.hero .chip,.phero .chip{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:#fff}
.spin-slow,.spin-rev{transform-box:fill-box;transform-origin:center;animation:spin 140s linear infinite}
.spin-rev{animation-duration:100s;animation-direction:reverse}
.flow{stroke-dasharray:6 12;animation:flowd 8s linear infinite}
.flow-slow{stroke-dasharray:90 310;animation:flowd 7s linear infinite}
.dash{stroke-dasharray:3 6}
@keyframes flowd{to{stroke-dashoffset:-400}}
.sweep{transform-box:view-box;transform-origin:200px 290px;animation:sweepr 9s ease-in-out infinite alternate}
@keyframes sweepr{from{transform:rotate(-20deg)}to{transform:rotate(95deg)}}
@media (max-width:760px){.phero-art{width:100%;opacity:.3}}

/* ---------- dark mode ---------- */
.dk{color-scheme:dark;
  --ink:#EEF2F8; --ink-2:#B9C3D2; --muted:#8F9AAB; --line:#223049; --line-2:#2F3E59; --mist:#0E1626; --paper:#09101C;
  --card:#111B2D; --soft:#1A2A47; --hdr:rgba(9,16,28,.86); --dotc:rgba(140,170,220,.22); --gridc:rgba(120,170,255,.07); --navy:#86A9F0}
.dk body{background:var(--paper)}
.dk .logo img,.dk .ftr img{filter:invert(1) hue-rotate(180deg) brightness(1.15)}
.dk .fx-glow{opacity:.07}
.dk .orbits [stroke="#D3DBE6"]{stroke:#26375A}
.dk .msg.me{background:#2F55A4;color:#fff}
.dk .tag.ok{background:#12351F;color:#6EE0A0}
.dk [style*="#FFF6E5"]{background:#2A2211!important;border-color:#6B5420!important;color:var(--ink)!important}
.dk .panel{box-shadow:none}
.dk .tilt:hover{box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.dk .dark,.dk .phero,.dk .hero,.dk .cta{border-top:1px solid #16223A}
.theme-t{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;margin-left:auto;flex:0 0 auto;transition:transform .3s var(--ease)}
.theme-t:hover{transform:rotate(-12deg)}
.theme-t svg{width:20px;height:20px}
.theme-t .sun,.dk .theme-t .moon{display:none}
.dk .theme-t .sun{display:block}
.hdr-cta{margin-left:0}
@media (max-width:1180px){.burger{margin-left:0}}
/* ---------- responsive polish ---------- */
@media (min-width:861px){.two.wide{grid-template-columns:1.5fr 1fr}}
@media (max-width:1320px){.nav>.ni>a{padding-inline:8px;font-size:14.5px}.hdr-in{gap:24px}}
@media (max-width:760px){.step span{grid-column:2}}
@media (max-width:640px){
  .hdr-in{height:64px}.logo img{height:38px}.mnav{inset:64px 0 0 0}
  .strip i{display:none}.strip-in{gap:6px 18px;font-size:13px;padding-block:14px}
  .hero-cta .btn{flex:1 1 auto;justify-content:center}
  .sh{margin-bottom:28px}.icard{min-height:300px}.icard.short{min-height:220px}
  .panel{padding:18px;border-radius:16px}.tcard{padding:22px}
  .askband .mini{width:72px;height:72px}
  .brow{grid-template-columns:1fr;gap:2px}
  #chat{right:8px;left:8px;bottom:8px;width:auto;height:calc(100dvh - 16px);border-radius:18px}
  #say{max-width:210px;font-size:13.5px}
  .ftr-g{grid-template-columns:1fr}
  .quote{padding:24px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .rv.pre{transform:none;opacity:1}
}
/* ---------- globe controls, office card, 3D city view ---------- */
.gl-ui{position:absolute;inset:0;pointer-events:none}
.gl-ui>*{pointer-events:auto}
.gl-zoom{position:absolute;right:4px;top:4px;display:grid;gap:6px}
.gl-zoom button{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(10,18,36,.72);color:#fff;font-size:20px;font-weight:700;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.gl-zoom button:hover{background:rgba(30,50,90,.9)}
.gl-hint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:12.5px;font-weight:600;color:#C8D2E2;background:rgba(10,18,36,.72);padding:6px 12px;border-radius:999px;white-space:nowrap;transition:opacity .4s;pointer-events:none!important}
.gl-hint.off{opacity:0}
.gl-3d{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:none;background:var(--red);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;box-shadow:0 12px 26px -10px rgba(224,27,34,.8);animation:pop .35s var(--ease)}
.gl-3d svg{width:14px;height:14px}
.gl-3d[hidden],.gl-tip[hidden],.gl-card[hidden]{display:none}
.gl-tip{position:absolute;transform:translate(-50%,calc(-100% - 12px));background:#fff;color:#0B0D12;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:8px;white-space:nowrap;pointer-events:none!important;box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}
.gl-card{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(340px,94%);background:rgba(12,20,40,.95);border:1px solid rgba(255,255,255,.14);border-radius:16px;overflow:hidden;color:#fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.75);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:pop .4s var(--ease);z-index:2}
.gl-ph{position:relative;aspect-ratio:2/1;background:#0C1830}
.gl-ph svg{width:100%;height:100%;display:block}
.gl-ph span{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(7,11,20,.65);padding:4px 8px;border-radius:6px;color:#CFE3FF}
.gl-cb{padding:14px 16px 16px;display:grid;gap:5px}
.gl-cb small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--glow)}
.gl-cb b{font-size:19px;line-height:1.25}
.gl-ad{font-size:14px;color:#BFC9D8;line-height:1.5}
.gl-ad i{font-style:normal;color:#8FA0B8}
.gl-ac{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.gl-ac .btn-line{color:#fff}
.gl-x{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:9px;border:none;background:rgba(7,11,20,.65);color:#fff;font-size:20px;line-height:1;cursor:pointer;z-index:2}
.gl-bot{position:absolute;transform:translate(-50%,calc(-100% - 6px));background:rgba(12,20,40,.9);border:1px solid rgba(127,227,255,.45);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;pointer-events:none!important;transition:opacity .3s}
.gl-bot[hidden]{display:none}
#city3d{position:fixed;inset:0;z-index:95;background:#070B14;display:flex;flex-direction:column;animation:pop .35s var(--ease)}
#city3d[hidden]{display:none}
.c3-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px var(--gut);padding-top:calc(10px + env(safe-area-inset-top,0px));background:linear-gradient(135deg,#0B1222,#16284C);color:#fff}
.c3-h small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--glow)}
.c3-h b{font-size:18px}
.c3-tools{display:flex;gap:8px;align-items:center}
.c3-tools .btn-line{color:#fff}
.c3-x{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;font-size:22px;line-height:1;cursor:pointer}
#c3map{flex:1;position:relative;background:#0A1224}
.c3-load{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));display:grid;gap:10px;justify-items:center;text-align:center;color:#DDE6F3;font-weight:600;background:rgba(12,20,40,.92);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px}
.c3-load[hidden]{display:none}
.c3-load span{font-weight:500;color:#AFBBCD;font-size:14px}
.c3-tip{position:absolute;left:12px;bottom:12px;font-size:12px;font-weight:600;color:#fff;background:rgba(7,11,20,.7);padding:6px 10px;border-radius:8px;pointer-events:none}
.c3-pin{display:flex;flex-direction:column;align-items:center}
.c3-pin span{background:var(--red);color:#fff;font:700 13px var(--font);padding:6px 10px;border-radius:8px;white-space:nowrap;box-shadow:0 10px 20px -8px rgba(0,0,0,.5)}
.c3-pin::after{content:"";width:3px;height:44px;background:linear-gradient(var(--red),rgba(224,27,34,0))}
@media (max-width:640px){.c3-tip{display:none}.c3-h b{font-size:16px}}


/* ================= Homepage (light) — footage, 3D products, motion ================= */
:root{--teal:#0E7A7E;--steel:#C9D0D8}
html.lenis,html.lenis body{height:auto}
html.lenis,.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-stopped{overflow:hidden}
.lenis.lenis-smooth iframe{pointer-events:none}

.home-l{background:var(--paper);color:var(--ink)}
.home-l .ill{position:absolute;right:12px;bottom:12px;z-index:3;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(11,13,18,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:5px 9px;border-radius:6px}

/* hero */
.lh{position:relative;padding-top:clamp(48px,7vw,96px);background:var(--paper)}
.lh-top{display:grid;grid-template-columns:1.35fr 1fr;gap:28px 56px;align-items:end}
.lh-title{font-size:clamp(40px,5.6vw,84px);font-weight:800;letter-spacing:-.045em;line-height:.98;margin-top:18px}
.lh-title .ln{display:block;overflow:hidden;padding-bottom:.06em}
.lh-title .ln>span{display:inline-block}
.lh-title em{font-style:normal;color:var(--red)}
.lh-side{display:grid;gap:26px;padding-bottom:8px}
.lh-side .lead{color:var(--ink-2)}
.lh-media-wrap{margin-top:clamp(36px,5vw,64px);padding-inline:var(--gut)}
.lh-media{position:relative;margin:0;height:clamp(320px,62vh,720px);border-radius:22px;overflow:hidden;background:var(--mist);will-change:clip-path}
.lh-frame,.lh-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s var(--ease)}
.lh-frame.on{opacity:1}
.lh-media.has-video .lh-video{opacity:1}
.lh-media.has-video .lh-frame{opacity:0!important}
.lh-media::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(11,13,18,.45));pointer-events:none}
.lh-cap{position:absolute;left:clamp(16px,2.4vw,32px);bottom:clamp(16px,2.4vw,28px);z-index:2;color:#fff;display:flex;flex-direction:column;gap:6px;max-width:70%}
.lh-cap span{font-size:clamp(15px,1.4vw,19px);font-weight:700;letter-spacing:-.01em}
.lh-cap i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.lh-dots{position:absolute;right:clamp(16px,2.4vw,32px);bottom:clamp(18px,2.4vw,30px);z-index:2;display:flex;gap:8px}
.lh-dots button{width:34px;height:4px;border-radius:4px;border:0;padding:0;background:rgba(255,255,255,.35);cursor:pointer;position:relative;overflow:hidden}
.lh-dots button::after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.lh-dots button.on::after{animation:lhdot 6s linear forwards}
@keyframes lhdot{to{transform:scaleX(1)}}
.lh-chips{display:flex;flex-wrap:wrap;gap:8px;padding-block:22px 0}
.lh-chips a{font-size:14px;font-weight:600;padding:8px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);transition:border-color .25s,color .25s,background .25s}
.lh-chips a:hover{border-color:var(--navy);color:var(--navy);background:var(--soft)}
.strip.light{background:var(--paper);color:var(--ink-2);border-bottom:1px solid var(--line)}

/* magnetic buttons */
.mag{will-change:transform}

/* 3D product theatre */
.pt{position:relative;background:linear-gradient(180deg,var(--paper),var(--mist))}
.pt-pin{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding-block:clamp(56px,7vw,90px)}
.pt-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(24px,4vw,64px);align-items:center;width:100%}
.pt-grid>*{min-width:0}
.pt-h{font-size:clamp(32px,4.2vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:14px 0 26px}
.pt-h b{color:var(--navy)}
.pt-list{list-style:none;margin:0;padding:0;display:grid;gap:4px;border-left:2px solid var(--line)}
.pt-list li{padding:12px 0 12px 22px;position:relative;cursor:pointer}
.pt-list li::before{content:"";position:absolute;left:-2px;top:0;bottom:0;width:2px;background:var(--red);transform:scaleY(0);transform-origin:top;transition:transform .5s var(--ease)}
.pt-list li.on::before{transform:scaleY(1)}
.pt-list b{display:block;font-size:clamp(17px,1.5vw,20px);font-weight:700;color:var(--muted);transition:color .4s}
.pt-list li.on b{color:var(--ink)}
.pt-list p{font-size:15px;color:var(--ink-2);line-height:1.55;max-height:0;opacity:0;overflow:hidden;transition:max-height .55s var(--ease),opacity .4s,margin .4s}
.pt-list li.on p{max-height:120px;opacity:1;margin-top:6px}
.pt-stage{position:relative;aspect-ratio:1/1;max-height:76vh;width:100%;border-radius:24px;background:radial-gradient(70% 60% at 50% 42%,#FFFFFF 0%,#EEF2F7 60%,#E2E8F0 100%);overflow:hidden}
.dk .pt-stage{background:radial-gradient(70% 60% at 50% 42%,#1B2740 0%,#111B2D 60%,#0B1322 100%)}
.pt-stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:pan-y;cursor:grab}
.pt-stage canvas:active{cursor:grabbing}
.pt-tag{position:absolute;left:18px;top:16px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pt-name{position:absolute;left:18px;bottom:16px;font-size:13px;font-weight:600;color:var(--ink-2)}
.pt-fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}

/* chapters */
.chs-head{display:grid;grid-template-columns:1fr 1fr;gap:28px 56px;align-items:end;padding-block:clamp(72px,9vw,120px) clamp(36px,5vw,60px)}
.chs-head h2{font-size:clamp(36px,5vw,72px);font-weight:800;letter-spacing:-.04em;line-height:1}
.cx{padding-block:clamp(64px,8vw,120px);border-top:1px solid var(--line);position:relative}
.cx-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(28px,5vw,80px);align-items:center}
.cx-grid.rev{grid-template-columns:.85fr 1.15fr}
.cx-grid>*{min-width:0}
.cx-tag{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin-bottom:14px}
.cx h3{font-size:clamp(30px,3.6vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.04;margin-bottom:18px}
.cx h3 b{color:var(--navy)}
.cx .lead{margin-bottom:24px}
.cx-media{position:relative;border-radius:20px;overflow:hidden;background:var(--mist);aspect-ratio:4/3}
.cx-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cx-list{list-style:none;margin:0 0 28px;padding:0;border-top:1px solid var(--line)}
.cx-list li{display:grid;grid-template-columns:minmax(140px,.8fr) 1.6fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.cx-list b{font-weight:700}
.cx-list span{color:var(--muted)}

/* engineering */
.eng-over{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.eng-over path,.eng-over line{fill:none;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.eng-over text{fill:#fff;font:700 22px var(--font);letter-spacing:.12em}
.eng-stages{position:relative;display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:0 0 28px;background:var(--card)}
.eng-stages span{position:relative;z-index:1;text-align:center;font-size:12.5px;font-weight:700;padding:10px 2px;color:var(--muted);transition:color .3s}
.eng-stages span.on{color:#fff}
.eng-stages i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);border-radius:999px}

/* wire harness horizontal */
.cx-wh{background:var(--mist);padding-block:0;overflow:hidden}
.wh-pin{height:100vh;height:100svh;display:flex;align-items:center}
.wh-track{display:flex;gap:clamp(16px,2vw,28px);padding-inline:var(--gut);will-change:transform}
.wh-panel{flex:0 0 auto;width:min(78vw,560px);height:min(68vh,560px);border-radius:22px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column}
.wh-intro{width:min(84vw,600px);background:none;border:0;justify-content:center;padding-right:24px}
.wh-intro h3{font-size:clamp(30px,3.6vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.04;margin:14px 0 18px}
.wh-intro h3 b{color:var(--red)}
.wh-lottie{padding:28px;justify-content:space-between}
.wh-lottie .lot{width:100%;flex:1;min-height:0}
.wh-lottie ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wh-lottie li{font-size:13px;font-weight:700;color:var(--muted);border-top:2px solid var(--line);padding-top:10px;transition:color .3s,border-color .3s}
.wh-lottie li.on{color:var(--ink);border-color:var(--red)}
.wh-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wh-photo figcaption{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:60px 24px 22px;color:#fff;font-weight:600;font-size:16px;line-height:1.4;background:linear-gradient(transparent,rgba(11,13,18,.7))}
.wh-photo .ill{top:12px;bottom:auto}
.wh-end{padding:30px;justify-content:space-between;background:var(--ink);color:#fff;border:0}
.dk .wh-end{background:#1B2A47}
.wh-end ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.wh-end li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:12px;font-weight:600}
.wh-end li span{color:#AFBBCD;font-weight:500;font-size:14px;text-align:right}
.wh-end .eyebrow{color:#9FDFFF}

/* plastics split */
.pl-media{aspect-ratio:4/3}
.pl-half{position:absolute;inset:0}
.pl-half img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pl-half.l{clip-path:inset(0 50% 0 0)}
.pl-half.r{clip-path:inset(0 0 0 50%)}
.pl-seam{position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(255,255,255,.8);z-index:2;transform:translateX(-1px)}
.pl-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.pl-steps div{border-top:2px solid var(--line);padding-top:12px}
.pl-steps b{display:block;font-size:14.5px}
.pl-steps span{font-size:13px;color:var(--muted);line-height:1.45;display:block;margin-top:4px}

/* medical */
.cx-med .cx-tag,.cx-med h3 b{color:var(--teal)}
.med-head{max-width:760px;margin:0 auto clamp(32px,4vw,52px);text-align:center}
.med-head .lead{margin-inline:auto}
.med-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:20px}
.med-grid>*{min-width:0}
.med-photo{aspect-ratio:auto;min-height:420px}
.med-photo img{height:118%;top:-9%}
.med-side{display:grid;gap:20px;grid-template-rows:auto 1fr}
.med-cal{border-radius:20px;background:var(--card);border:1px solid var(--line);padding:22px}
.med-cal .lot{aspect-ratio:500/260;width:100%}
.med-cal p{font-size:13.5px;color:var(--muted);margin-top:8px}
.med-fam{list-style:none;margin:0;padding:0;border-radius:20px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.med-fam li{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}
.med-fam li:last-child{border-bottom:0}
.med-fam li span{font-weight:500;color:var(--muted);font-size:13.5px;text-align:right}

/* data */
.data-box{border-radius:20px;background:var(--card);border:1px solid var(--line);padding:clamp(18px,2.4vw,30px)}
.data-src,.data-out{display:flex;flex-wrap:wrap;gap:8px}
.data-src span,.data-out span{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--mist);color:var(--ink-2)}
.data-out span{background:var(--soft);color:var(--navy)}
.data-lot{position:relative;margin:18px 0 26px}
.data-lot .lot{aspect-ratio:660/180;width:100%}
.data-lbl{position:absolute;left:0;right:0;bottom:-8px;height:20px}
.data-lbl b{position:absolute;transform:translateX(-50%);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.data-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px}
.data-tools b{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.data-tools p{font-size:14.5px}

/* AI island */
.aip{display:grid;gap:18px}
.aip-tabs{display:flex;gap:6px;flex-wrap:wrap}
.aip-tab{position:relative;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-2);isolation:isolate}
.aip-tab[aria-selected="true"]{color:#fff;border-color:transparent}
.aip-pill{position:absolute;inset:-1px;border-radius:999px;background:var(--ink);z-index:-1}
.dk .aip-pill{background:var(--navy)}
.aip-win{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;box-shadow:0 40px 80px -50px rgba(11,13,18,.35)}
.aip-bar{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--mist)}
.aip-bar i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.aip-bar span{margin-left:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.aip-body{padding:clamp(20px,2.6vw,32px);display:grid;gap:14px;min-height:330px;align-content:start}
.aip-body h4{font-size:26px;font-weight:800;letter-spacing:-.02em}
.aip-body>p{color:var(--ink-2);max-width:62ch}
.aip-flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:8px 0 6px}
.aip-step{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper);position:relative}
.aip-step:not(:last-child)::after{content:"";position:absolute;right:-11px;top:50%;width:10px;height:2px;background:var(--red)}
.aip-step small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:800;margin-bottom:6px}
.aip-step span{font-size:13.5px;font-weight:600;line-height:1.35;display:block}
.aip-note{font-size:12.5px;color:var(--muted)}

/* digital island */
.sysmap{position:relative;height:clamp(380px,46vw,520px);border-radius:22px;background:radial-gradient(60% 60% at 50% 50%,var(--card),var(--mist));border:1px solid var(--line);overflow:hidden;touch-action:pan-y;user-select:none}
.sysmap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sysmap line{stroke:var(--line-2);stroke-width:1.6}
.sysmap line.on{stroke:var(--red)}
.sys-hub{position:absolute;width:132px;height:132px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:14px;line-height:1.25;left:50%;top:50%;margin:-66px 0 0 -66px;box-shadow:0 20px 50px -20px rgba(11,13,18,.5)}
.dk .sys-hub{background:var(--navy)}
.sys-node{position:absolute;left:0;top:0;width:116px;margin:-21px 0 0 -58px;height:42px;border-radius:999px;background:var(--card);border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px;cursor:grab;color:var(--ink)}
.sys-node:active{cursor:grabbing}
.sys-node.on{border-color:var(--red);color:var(--red)}
.sys-hint{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--muted);font-weight:600}
.sys-info{min-height:84px}
.sys-info b{display:block;font-size:18px;margin-bottom:4px}
.sys-info p{color:var(--ink-2);font-size:15px}

/* light continuum / global / cta on home */
.home-l .steps .step span{color:var(--muted)!important}
.home-l .region{border-bottom-color:var(--line)}
.home-l .region p{color:var(--muted)}
.home-l .legend{color:var(--ink-2)}
.home-l .globe-wrap{border-radius:50%}
.lcta{padding-block:clamp(90px,12vw,170px);text-align:left;overflow:hidden;border-top:1px solid var(--line)}
.lcta h2{font-size:clamp(48px,9vw,140px);font-weight:800;letter-spacing:-.055em;line-height:.92}
.lcta h2 b{color:var(--red)}
.lcta .hero-cta{margin-top:36px}

/* responsive */
@media (max-width:1000px){
  .lh-top,.pt-grid,.chs-head,.cx-grid,.cx-grid.rev,.med-grid{grid-template-columns:1fr}
  .cx-grid.rev>.cx-media{order:-1}
  .pt-stage{max-height:none;aspect-ratio:4/3}
  .data-tools{grid-template-columns:1fr 1fr}
  .aip-flow{grid-template-columns:1fr 1fr}
  .aip-step:not(:last-child)::after{display:none}
}
@media (max-width:900px){
  .cx-wh{padding-block:64px}
  .wh-pin{height:auto}
  .wh-track{flex-direction:column;width:100%}
  .wh-panel,.wh-intro{width:100%;height:auto;min-height:340px}
  .wh-intro{min-height:0;padding-right:0}
  .wh-lottie .lot{aspect-ratio:600/260;flex:none}
}
@media (max-width:640px){
  .lh-media{height:58vh;border-radius:16px}
  .pl-steps{grid-template-columns:1fr 1fr}
  .cx-list li{grid-template-columns:1fr;gap:2px}
  .med-photo{min-height:300px}
  .data-tools{grid-template-columns:1fr}
  .aip-flow{grid-template-columns:1fr}
  .eng-stages span{font-size:10.5px}
  .data-lbl b{font-size:9.5px;letter-spacing:.06em}
}
@media (prefers-reduced-motion:reduce){
  .lh-dots button.on::after{animation:none;transform:scaleX(1)}
}

/* ---------- v2 additions ---------- */
.pt-hint{margin-top:22px;font-size:13.5px;color:var(--muted)}
.pt-ex{position:absolute;right:16px;top:12px;z-index:2;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.pt-ex[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pt-name{display:flex;flex-direction:column;gap:2px}
.pt-name b{font-size:14px;color:var(--ink)}
.pt-name span{font-size:12.5px;color:var(--muted);font-weight:500}
.eng-wrap{position:relative;padding-bottom:clamp(40px,6vw,80px)}
.eng-media{aspect-ratio:16/10}
.eng-inset{position:absolute;right:-4%;bottom:0;width:44%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:6px solid var(--paper);box-shadow:0 30px 60px -30px rgba(11,13,18,.45);z-index:3}
.eng-inset img{width:100%;height:100%;object-fit:cover}
.wh-photo.wide{width:min(90vw,820px)}
.pl-wide{aspect-ratio:21/9;border-radius:22px}
.pl-wide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,18,.62) 0%,rgba(11,13,18,.25) 45%,transparent 70%);z-index:1}
.pl-wide-cap{position:absolute;left:clamp(20px,4vw,56px);bottom:clamp(20px,4vw,52px);z-index:2;max-width:520px;color:#fff}
.pl-wide-cap h3{color:#fff;margin:0}
.pl-wide-cap h3 b{color:#FFB4B6}
.pl-wide .ill{top:12px;bottom:auto}
.qa-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.qa-h b{font-size:15px}
.qa-h span{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.qa-rows{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.qa-rows li{display:grid;grid-template-columns:1.2fr 1fr auto;gap:12px;align-items:center;font-size:13.5px;font-weight:600}
.qa-rows i{height:6px;border-radius:6px;background:var(--mist);overflow:hidden;display:block}
.qa-rows i b{display:block;height:100%;width:var(--w);background:var(--teal);border-radius:6px}
.qa-rows em{font-style:normal;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.qa-rows em.ok{background:#E3F4EC;color:#1E7A4B}.qa-rows em.due{background:#FFF1D6;color:#8A5A12}
.dk .qa-rows em.ok{background:#12351F;color:#6EE0A0}.dk .qa-rows em.due{background:#2A2211;color:#F2C46B}

/* AI product window */
.aip-run{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer;color:var(--ink)}
.aip-body{grid-template-columns:1.5fr 1fr;gap:clamp(18px,3vw,32px);align-items:start}
.aip-main{display:grid;gap:14px;min-width:0}
.aip-step{overflow:hidden;transition:border-color .3s,background .3s}
.aip-step small{display:flex;align-items:center;gap:6px}
.aip-dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);display:inline-block}
.aip-step.s-run{border-color:var(--red)}
.aip-step.s-run .aip-dot{background:var(--red);animation:aipblink 1s infinite}
.aip-step.s-done .aip-dot{background:#2E8B57}
.aip-step.s-wait{opacity:.6}
.aip-bar2{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--red);transform-origin:left;display:block}
.aip-step.s-done .aip-bar2{background:#2E8B57}
@keyframes aipblink{50%{opacity:.3}}
.aip-log{border:1px solid var(--line);border-radius:14px;background:var(--mist);padding:14px;min-height:230px;font-size:13.5px;display:grid;gap:8px;align-content:start}
.aip-log-h{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.aip-line{display:flex;gap:8px;align-items:flex-start;color:var(--ink-2)}
.aip-line i{font-style:normal;width:18px;flex:none;color:var(--red);font-weight:800}
.aip-line.ok i{color:#2E8B57}

/* dashboard */
.dash{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;box-shadow:0 40px 80px -50px rgba(11,13,18,.35)}
.dash-ex{margin-left:auto;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8A5A12;background:#FFF1D6;padding:4px 9px;border-radius:999px}
.dash-in{display:grid;grid-template-columns:220px 1fr;min-height:420px}
.dash-nav{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.dash-tab{position:relative;text-align:left;border:0;background:none;padding:11px 14px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer;isolation:isolate}
.dash-tab[aria-selected="true"]{color:var(--navy)}
.dash-pill{position:absolute;inset:0;border-radius:10px;background:var(--soft);z-index:-1}
.dash-main{padding:clamp(14px,2vw,24px);display:grid;gap:16px;min-width:0}
.dash-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px}
.kpi small{font-size:12px;font-weight:700;color:var(--muted)}
.kpi b{font-size:24px;letter-spacing:-.02em}
.spark{width:100%;height:30px}.spark path{stroke:var(--navy)}.spark.up path{stroke:#2E8B57}.spark.warn path{stroke:#C77A12}
.dash-row{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.dash-row>*{min-width:0}
.dash-card{border:1px solid var(--line);border-radius:14px;padding:14px}
.dash-ct{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.dash-ct span{font-weight:500;color:var(--muted);font-size:12px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--navy);stroke-width:2.6}
.chart .plan{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 5}
.chart .th{stroke:var(--red);stroke-width:1.4;stroke-dasharray:6 5}
.chart .area{fill:var(--soft)}
.chart .pt{fill:var(--navy)}.chart .pt.hot{fill:var(--red)}
.chart .bar{fill:var(--navy);opacity:.85}.chart .bar.hot{fill:var(--red)}
.chart .cum{fill:none;stroke:var(--ink);stroke-width:1.6}
.chart .lbl{font-size:12px;fill:var(--muted);font-family:var(--font)}
.chart .tip rect{fill:var(--ink)}.chart .tip text{fill:#fff;font:700 13px var(--font)}
.chart g[role="button"]:focus{outline:none}
.dash-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dash-list li{display:flex;gap:10px;align-items:flex-start}
.dash-list li i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:#2E8B57}
.dash-list li i.warn{background:#E0A11B}
.dash-list b{display:block;font-size:14px}
.dash-list span{font-size:12.5px;color:var(--muted)}

/* quality */
.cx-q{padding-top:0;border-top:0}
.q-band{position:relative;height:clamp(320px,58vh,640px);overflow:hidden;background:var(--mist)}
.q-band img{position:absolute;left:0;top:-9%;width:100%;height:118%;object-fit:cover}
.q-band .ill{top:14px;bottom:auto}
.q-body{position:relative;z-index:2}
.q-card{background:var(--paper);border-radius:20px;padding:clamp(22px,3vw,40px);margin-top:clamp(-140px,-12vw,-60px);max-width:760px;box-shadow:0 40px 80px -50px rgba(11,13,18,.4)}
.q-steps{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:clamp(36px,5vw,64px) 0 clamp(28px,4vw,48px)}
.q-rail{position:absolute;left:0;right:0;top:9px;height:2px;background:var(--line);overflow:hidden}
.q-rail i{position:absolute;inset:0;background:var(--navy);transform:scaleX(0);transform-origin:left;display:block}
.q-steps>div{position:relative;padding-top:30px}
.q-steps>div::before{content:"";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--line-2);transition:background .3s,border-color .3s}
.q-steps>div.on::before{background:var(--navy);border-color:var(--navy)}
.q-steps b{display:block;font-size:17px}
.q-steps span{font-size:13.5px;color:var(--muted)}
.q-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,4vw,56px);align-items:start}
.q-grid>*{min-width:0}
.q-certs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-certs .eyebrow,.q-certs .link{grid-column:1/-1}
.q-cert{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card)}
.q-cert b{display:block;font-size:16px}
.q-cert span{font-size:13px;color:var(--muted)}

@media (max-width:1000px){
  .aip-body{grid-template-columns:1fr}
  .dash-in{grid-template-columns:1fr}
  .dash-nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .dash-tab{white-space:nowrap}
  .dash-row,.q-grid{grid-template-columns:1fr}
  .eng-inset{right:0}
}
@media (max-width:640px){
  .dash-kpis{grid-template-columns:1fr}
  .q-steps{grid-template-columns:1fr 1fr}
  .q-rail{display:none}
  .pl-wide{aspect-ratio:4/3}
  .eng-inset{width:52%}
  .q-certs{grid-template-columns:1fr}
}

/* ================= light theme pass: every page ================= */
.ill{position:absolute;right:12px;bottom:12px;z-index:3;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(11,13,18,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:5px 9px;border-radius:6px;font-style:normal}
.dark,.cta{background:var(--mist);color:var(--ink)}
.dark .eyebrow,.phero .eyebrow{color:var(--navy)}
.dark .lead,.phero .lead,.cta .lead{color:var(--ink-2)}
.dark .link{color:var(--navy)}
.dark .tcard{background:var(--card);border-color:var(--line);-webkit-backdrop-filter:none;backdrop-filter:none}
.dark .tcard p{color:var(--ink-2)}
.dark .tcard .ico{background:var(--soft);color:var(--navy)}
.dark .steps .rail{background:var(--line-2)}
.dark .step i{background:var(--card)}
.dark .chip,.phero .chip,.hero .chip{background:var(--card);border-color:var(--line);color:var(--ink)}
.fx canvas{display:none!important}
.strip{background:var(--paper);color:var(--ink-2);border-bottom:1px solid var(--line)}
.cta{border-top:1px solid var(--line)}
.cta h2{color:var(--ink)}
.cta h2::after{content:"";display:block;width:56px;height:4px;border-radius:4px;background:var(--red);margin-top:22px}

/* page hero: light, with a photograph */
.phero{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line)}
.phero-g{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,4vw,64px);align-items:center;padding-block:clamp(36px,5vw,72px)}
.phero-g>*{min-width:0}
.phero-in{padding-block:0;max-width:640px}
.crumb{color:var(--muted)}
.crumb a:hover{color:var(--red)}
.phero h1{color:var(--ink)}
.phero-ph{position:relative;margin:0;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:var(--mist);box-shadow:0 40px 80px -50px rgba(11,13,18,.45)}
.phero-ph .ph-in{position:absolute;inset:-6% 0;will-change:transform}
.phero-ph img{width:100%;height:100%;object-fit:cover;display:block;animation:phkb 9s cubic-bezier(.2,.7,.2,1) both}
.phero-ph .art{position:absolute;inset:0;z-index:0}
@keyframes phkb{from{transform:scale(1.14);filter:saturate(.8)}to{transform:scale(1);filter:none}}
@media (max-width:860px){.phero-g{grid-template-columns:1fr}.phero-ph{aspect-ratio:16/10}}

/* image cards: photo on top, light card below */
.icard{background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:0!important;justify-content:flex-start}
.icard::before{display:none}
.icard::after{background:radial-gradient(420px circle at var(--gx,50%) var(--gy,50%),rgba(47,85,164,.07),transparent 45%)}
.icard .art{position:relative;inset:auto;z-index:0;aspect-ratio:16/10;flex:none;overflow:hidden}
.icard.short .art{aspect-ratio:4/3}
.icard .art.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:transform 1.4s var(--ease)}
.icard:hover .art.ph img{transform:scale(1.07)!important}
.icard .ib{padding:20px 22px 22px;gap:8px}
.icard h3{color:var(--ink);font-size:20px;line-height:1.25}
.icard p{color:var(--ink-2)}
.icard .eyebrow{color:var(--navy)}
.icard .link{color:var(--red)}
.icard .sheen{z-index:1;height:auto;aspect-ratio:16/10;bottom:auto}
.proof .icard .art{aspect-ratio:16/9}
.art.ph{background:var(--mist)}
.icard .art:not(.ph),.phero-ph .art:not(.ph){background:radial-gradient(120% 100% at 75% 15%,#EAF1FB 0%,#DCE6F3 100%)}
.quote{background:var(--card)}

/* mega menu featured */
.mega-feat{color:var(--ink);background:var(--card);flex-direction:column;align-items:stretch;padding:0;min-height:0;border:1px solid var(--line)}
.mega-feat::before{display:none}
.mega-feat .art{position:relative;inset:auto;z-index:0;aspect-ratio:16/10;flex:none}
.mega-feat .art.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mega-feat>div:last-child{padding:14px 16px 16px}
.mega-feat .eyebrow{color:var(--red)}

/* ask band, regions, legend */
.askband{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.askform input{border-color:var(--line);background:var(--card);color:var(--ink)}
.askform input::placeholder{color:var(--muted)}
.askq button{border-color:var(--line);background:var(--card);color:var(--ink)}
.askq button:hover{background:var(--mist)}
.region{border-bottom-color:var(--line)}
.region p{color:var(--muted)}
.legend{color:var(--ink-2)}

/* globe controls and office card */
.gl-zoom button{background:rgba(255,255,255,.92);border-color:var(--line);color:var(--ink)}
.gl-zoom button:hover{background:var(--mist)}
.gl-hint{background:rgba(255,255,255,.94);color:var(--ink-2);border:1px solid var(--line)}
.gl-card{background:rgba(255,255,255,.98);border-color:var(--line);color:var(--ink);box-shadow:0 30px 60px -30px rgba(11,13,18,.35)}
.gl-ph{background:var(--mist)}
.gl-ph img{width:100%;height:100%;object-fit:cover;display:block}
.gl-ph span{background:rgba(255,255,255,.88);color:var(--ink-2)}
.gl-cb small{color:var(--navy)}
.gl-ad{color:var(--ink-2)}.gl-ad i{color:var(--muted)}
.gl-ac .btn-line{color:var(--ink)}
.gl-x{background:rgba(255,255,255,.9);color:var(--ink)}
.gl-bot{background:rgba(255,255,255,.96);border-color:var(--line);color:var(--ink)}
#city3d{background:var(--paper)}
.c3-h{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line)}
.c3-h small{color:var(--navy)}
.c3-tools .btn-line{color:var(--ink)}
.c3-x{border-color:var(--line);color:var(--ink)}
#c3map{background:var(--mist)}
.c3-load{background:rgba(255,255,255,.96);border-color:var(--line);color:var(--ink)}
.c3-load span{color:var(--muted)}
.c3-tip{background:rgba(255,255,255,.92);color:var(--ink)}

/* assistant chat header */
.ch-h{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
.ch-h .av{background:var(--soft)}
.ch-h small{color:var(--muted)}
.ch-x{border-color:var(--line);color:var(--ink)}

/* homepage leftovers */
.wh-end{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.dk .wh-end{background:var(--card)}
.wh-end li{border-bottom-color:var(--line)}
.wh-end li span{color:var(--muted)}
.wh-end .eyebrow{color:var(--navy)}
.sys-hub{background:linear-gradient(140deg,#3563B8,#22448A)!important;box-shadow:0 20px 50px -20px rgba(34,68,138,.55)!important}

/* hero: industry photo wall blended into the page */
.lh-stage{position:relative;overflow:hidden;margin-top:calc(-1 * clamp(48px,7vw,96px));padding-top:clamp(48px,7vw,96px);padding-bottom:clamp(24px,3vw,40px)}
.lh-top{grid-template-columns:minmax(0,680px)!important;align-items:start;min-height:clamp(560px,74vh,780px);align-content:center;position:relative;z-index:2}
.lh-copy{display:grid;gap:30px}
.lh-copy .lh-side{max-width:520px;padding-bottom:0}
.lh-bg{position:absolute;z-index:1;top:-40px;bottom:-40px;right:-2vw;width:min(62vw,940px);display:grid;grid-template-columns:repeat(3,1fr);gap:16px;transform:rotate(-6deg) translateX(4%);transform-origin:center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.25) 16%,#000 46%),linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.25) 16%,#000 46%),linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask-composite:intersect}
.lh-col{overflow:hidden;min-width:0}
.lh-run{display:flex;flex-direction:column;gap:16px;animation:lhUp 64s linear infinite}
.lh-col.c1 .lh-run{animation-name:lhDown;animation-duration:72s}
.lh-col.c2 .lh-run{animation-duration:58s;margin-top:-90px}
.lh-bg:hover .lh-run{animation-play-state:paused}
@keyframes lhUp{from{transform:translateY(0)}to{transform:translateY(calc(-50% - 8px))}}
@keyframes lhDown{from{transform:translateY(calc(-50% - 8px))}to{transform:translateY(0)}}
.lh-tile{position:relative;display:block;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:var(--mist);box-shadow:0 18px 40px -24px rgba(11,13,18,.35)}
.lh-tile img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.lh-tile:hover img{transform:scale(1.06)}
.lh-tile::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(11,13,18,.55));pointer-events:none}
.lh-tile span{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;color:#fff;font-size:13px;font-weight:700;letter-spacing:-.005em;line-height:1.25}
.lh-stage::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(60% 70% at 18% 55%,var(--paper) 30%,transparent 75%)}
.lh-stage::after{content:"Illustrative images";position:absolute;right:var(--gut);bottom:18px;z-index:3;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);background:rgba(255,255,255,.9);padding:5px 10px;border-radius:999px;box-shadow:0 4px 14px -6px rgba(11,13,18,.25)}
@media (prefers-reduced-motion:reduce){.lh-run{animation:none!important}}
@media (max-width:900px){
  .lh-top{min-height:0}
  .lh-stage{padding-bottom:0;display:flex;flex-direction:column}
  .lh-bg{order:2}
  .lh-bg{position:relative;top:auto;bottom:auto;right:auto;width:auto;height:340px;margin:28px 0 0;transform:none;grid-template-columns:repeat(3,1fr);gap:10px;padding-inline:var(--gut);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%);-webkit-mask-composite:source-over;mask-composite:add}
  .lh-run{gap:10px}
  .lh-tile{border-radius:12px}
  .lh-tile span{font-size:11px;left:9px;right:9px;bottom:8px}
  .lh-stage::before{display:none}
  .lh-stage::after{bottom:14px;font-size:9.5px}
}

/* living tiles: slow Ken Burns on every photo, staggered so the wall never moves in sync */
.lh-ph{position:absolute;inset:0;animation:lhKB 16s ease-in-out infinite alternate;transform-origin:50% 60%}
.lh-tile:nth-child(2n) .lh-ph{animation-duration:19s;animation-delay:-6s;transform-origin:30% 40%}
.lh-tile:nth-child(3n) .lh-ph{animation-duration:22s;animation-delay:-11s;transform-origin:70% 50%}
@keyframes lhKB{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.14) translate(-2%,-1.5%)}}
.lh-tile:hover img{filter:brightness(1.06) saturate(1.08)}
.lh-tile span{transition:transform .5s var(--ease)}
.lh-tile:hover span{transform:translateY(-4px)}
.lh-tile::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-120%);pointer-events:none}
.lh-tile:hover::before{transform:translateX(120%);transition:transform 1s var(--ease)}
.lh-stage::after{top:clamp(14px,2vw,24px);bottom:auto!important}
@media (prefers-reduced-motion:reduce){.lh-ph{animation:none!important}.lh-bpw,.lh-lens{display:none!important}}

/* blueprint lens */
.lh-tile img{transition:filter .4s}
.lh-bpw{position:absolute;inset:0;z-index:1;clip-path:circle(var(--lr,0px) at var(--mx,-200px) var(--my,-200px));pointer-events:none}
.lh-bpw img{width:100%;height:100%;object-fit:cover}
.lh-bpw img:not([src]){visibility:hidden}

<g class="c"><ellipse cx="450" cy="450" rx="420" ry="132" stroke="${st[2]}" stroke-opacity="${op}" stroke-width="1.5" transform="rotate(90 450 450)"/><circle cx="318" cy="450" r="6" fill="${e[2]}"/></g></svg>`;

const FX = { list: [], io: null, raf: 0 };
FX.io = new IntersectionObserver(es => es.forEach(e => { const f = FX.list.find(x => x.el === e.target); if (f) f.vis = e.isIntersecting; }), { rootMargin: '80px' });
function fxLoop(t) {

function fxAdd(el, draw, resize) {

  if (resize) resize();

}
function fxClear() { FX.list.forEach(f => { FX.io.unobserve(f.el); f.dispose && f.dispose(); }); FX.list = []; }
addEventListener('resize', () => FX.list.forEach(f => f.resize && f.resize()));
