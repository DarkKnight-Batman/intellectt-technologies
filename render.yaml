# Render Blueprint: New > Blueprint, pick this repo. Deploys as a free static site.
services:
  - type: web
    name: intellectt-website
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /logo/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
